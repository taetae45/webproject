<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Packing Detection</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/button.css">
</head>
<body>
    <header>
        <div class="logo"><img src="assets/logo.svg" alt="AI Packing Detection"></div>
        <button class="menu" id="menuButton" type="button" aria-expanded="false" aria-controls="menuPanel">☰</button>
        <nav class="menu-panel" id="menuPanel" aria-label="เมนูหลัก" hidden>
            <a href="history.html">ประวัติสินค้า</a>
        </nav>
    </header>

    <section class="toolbar">
        <select id="cameraSelect"><option>Select Camera</option></select>
        <button id="startBtn">START</button>
        <button id="resetBtn">RESET</button>
    </section>

    <section class="container">
        <div class="left-panel"><video id="video" autoplay playsinline></video></div>
        <div class="right-panel">
            <div class="card order-card">
                <h3>Order</h3>
                <ul id="orderList"></ul>
                <ul id="unexpectedList" aria-live="polite"></ul>
            </div>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/order.js"></script>
    <script src="js/detector.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
